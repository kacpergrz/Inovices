<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Faktur</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>Faktury i Wyniki</h1>
    <nav class="main-nav hidden" id="main-nav">
      <button type="button" class="nav-btn active" id="nav-faktury" data-target="app-view">Faktury</button>
      <button type="button" class="nav-btn" id="nav-wyniki" data-target="results-view">Wyniki</button>
    </nav>
    <button id="btn-logout" class="btn btn-secondary btn-small hidden">Wyloguj</button>
  </header>

  <!-- WIDOK LOGOWANIA -->
  <main class="container" id="login-view">
    <section class="login-box">
      <h2>Zaloguj się</h2>
      <form id="login-form" novalidate>
        <div class="form-row">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" required>
        </div>
        <div class="form-row">
          <label for="login-password">Hasło</label>
          <input type="password" id="login-password" required>
        </div>
        <span class="error-msg" id="login-error"></span>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Zaloguj</button>
        </div>
      </form>
    </section>
  </main>

  <!-- WIDOK PANELU FAKTUR (widoczny po zalogowaniu) -->
  <main class="container hidden" id="app-view">
    <!-- Komunikaty globalne (błędy / ładowanie) -->
    <div id="global-status" class="status-bar" aria-live="polite"></div>

    <!-- Sekcja wyszukiwania, filtrowania, sortowania i dodawania -->
    <section class="toolbar">
      <div class="search-box">
        <label for="search-input">Szukaj (sprzedawca lub NIP)</label>
        <input type="text" id="search-input" placeholder="np. ACME sp. z o.o. lub 1234567890">
      </div>
      <div class="filter-box">
        <label for="filter-status">Status</label>
        <select id="filter-status">
          <option value="all">Wszystkie</option>
          <option value="paid">Opłacone</option>
          <option value="unpaid">Nieopłacone</option>
        </select>
      </div>
      <div class="filter-box">
        <label for="sort-select">Sortowanie</label>
        <select id="sort-select">
          <option value="newest">Najnowsze</option>
          <option value="oldest">Najstarsze</option>
          <option value="due-soonest">Najbliższy termin płatności</option>
        </select>
      </div>
      <button id="btn-open-add" class="btn btn-primary">+ Dodaj fakturę</button>
    </section>

    <!-- Tabela faktur -->
    <section class="table-wrapper">
      <table id="invoices-table" class="invoices-table">
        <thead>
          <tr>
            <th>Numer faktury</th>
            <th>Numer KSeF</th>
            <th>Sprzedawca</th>
            <th>NIP</th>
            <th>Data wystawienia</th>
            <th>Termin płatności</th>
            <th>Netto</th>
            <th>Brutto</th>
            <th>Waluta</th>
            <th>Status</th>
            <th>Akcje</th>
          </tr>
        </thead>
        <tbody id="invoices-tbody">
          <!-- Wiersze generowane przez app.js -->
        </tbody>
      </table>
    </section>
  </main>

  <!-- WIDOK WYNIKI (pojazdy / kierowcy) -->
  <main class="container hidden" id="results-view">
    <div id="results-status" class="status-bar" aria-live="polite"></div>

    <section class="sub-tabs">
      <button type="button" class="sub-tab-btn active" data-subtarget="sub-wynik-pojazdu">Wynik pojazdu</button>
      <button type="button" class="sub-tab-btn" data-subtarget="sub-wyplata">Wypłata kierowcy</button>
      <button type="button" class="sub-tab-btn" data-subtarget="sub-podsumowanie-pojazdu">Podsumowanie pojazdu</button>
      <button type="button" class="sub-tab-btn" data-subtarget="sub-porownanie">Porównanie pojazdów</button>
    </section>

    <!-- WYNIK POJAZDU -->
    <section class="sub-panel" id="sub-wynik-pojazdu">
      <div class="filters-row">
        <div class="filter-box">
          <label for="wp-vehicle-select">Pojazd</label>
          <select id="wp-vehicle-select"></select>
        </div>
        <div class="filter-box">
          <label for="wp-month-select">Miesiąc</label>
          <select id="wp-month-select"></select>
        </div>
        <button type="button" class="btn btn-primary" id="btn-load-wp">Pokaż wynik</button>
      </div>
      <div id="wp-result"></div>
    </section>

    <!-- WYPLATA KIEROWCY -->
    <section class="sub-panel hidden" id="sub-wyplata">
      <div class="filters-row">
        <div class="filter-box">
          <label for="wy-driver-select">Kierowca</label>
          <select id="wy-driver-select"></select>
        </div>
        <div class="filter-box">
          <label for="wy-month-select">Miesiąc</label>
          <select id="wy-month-select"></select>
        </div>
        <button type="button" class="btn btn-primary" id="btn-load-wy">Pokaż wypłatę</button>
      </div>
      <div id="wy-result"></div>
    </section>

    <!-- PODSUMOWANIE POJAZDU -->
    <section class="sub-panel hidden" id="sub-podsumowanie-pojazdu">
      <div class="filters-row">
        <div class="filter-box">
          <label for="pp-vehicle-select">Pojazd</label>
          <select id="pp-vehicle-select"></select>
        </div>
        <div class="filter-box">
          <label for="pp-month-select">Miesiąc</label>
          <select id="pp-month-select"></select>
        </div>
        <button type="button" class="btn btn-primary" id="btn-load-pp">Pokaż podsumowanie</button>
      </div>
      <div id="pp-result"></div>
    </section>

    <!-- POROWNANIE POJAZDOW -->
    <section class="sub-panel hidden" id="sub-porownanie">
      <div class="filters-row">
        <div class="filter-box">
          <label for="por-month-select">Miesiąc</label>
          <select id="por-month-select"></select>
        </div>
        <button type="button" class="btn btn-primary" id="btn-load-por">Pokaż porównanie</button>
      </div>
      <div id="por-result"></div>
    </section>
  </main>

  <!-- MODAL: Dodaj / Edytuj faktura -->
  <div id="invoice-form-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h2 id="invoice-form-title">Dodaj fakturę</h2>
      <form id="invoice-form" novalidate>
        <input type="hidden" id="invoice-id">

        <div class="form-row">
          <label for="f-invoice-number">Numer faktury *</label>
          <input type="text" id="f-invoice-number" required>
          <span class="error-msg" id="err-invoice-number"></span>
        </div>

        <div class="form-row">
          <label for="f-ksef-number">Numer KSeF (opcjonalnie)</label>
          <input type="text" id="f-ksef-number">
          <span class="error-msg" id="err-ksef-number"></span>
        </div>

        <div class="form-row">
          <label for="f-seller-name">Sprzedawca *</label>
          <input type="text" id="f-seller-name" required>
          <span class="error-msg" id="err-seller-name"></span>
        </div>

        <div class="form-row">
          <label for="f-seller-nip">NIP *</label>
          <input type="text" id="f-seller-nip" required maxlength="10" placeholder="10 cyfr">
          <span class="error-msg" id="err-seller-nip"></span>
        </div>

        <div class="form-row">
          <label for="f-issue-date">Data wystawienia *</label>
          <input type="date" id="f-issue-date" required>
          <span class="error-msg" id="err-issue-date"></span>
        </div>

        <div class="form-row">
          <label for="f-due-date">Termin płatności *</label>
          <input type="date" id="f-due-date" required>
          <span class="error-msg" id="err-due-date"></span>
        </div>

        <div class="form-row">
          <label for="f-net-amount">Kwota netto *</label>
          <input type="text" id="f-net-amount" required placeholder="np. 1234.56">
          <span class="error-msg" id="err-net-amount"></span>
        </div>

        <div class="form-row">
          <label for="f-gross-amount">Kwota brutto *</label>
          <input type="text" id="f-gross-amount" required placeholder="np. 1518.51">
          <span class="error-msg" id="err-gross-amount"></span>
        </div>

        <div class="form-row">
          <label for="f-currency">Waluta *</label>
          <select id="f-currency" required>
            <option value="PLN">PLN</option>
            <option value="EUR">EUR</option>
          </select>
        </div>

        <div class="form-row" id="nbp-preview-row" style="display:none;">
          <span class="nbp-preview" id="nbp-preview-text"></span>
        </div>

        <div class="form-row">
          <label for="f-paid">Status początkowy *</label>
          <select id="f-paid" required>
            <option value="false">Nieopłacona</option>
            <option value="true">Opłacona</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Zapisz</button>
          <button type="button" class="btn btn-secondary" id="btn-cancel-form">Anuluj</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: Potwierdzenie akcji -->
  <div id="confirm-modal" class="modal-overlay hidden">
    <div class="modal-box modal-box-small">
      <p id="confirm-modal-text"></p>
      <div class="form-actions">
        <button type="button" class="btn btn-primary" id="confirm-modal-yes">Tak</button>
        <button type="button" class="btn btn-secondary" id="confirm-modal-cancel">Anuluj</button>
      </div>
    </div>
  </div>

  <!-- MODAL: Ustaw termin płatności -->
  <div id="due-date-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h2>Ustaw termin płatności</h2>
      <p id="due-date-invoice-label"></p>

      <div class="form-row">
        <label>
          <input type="radio" name="due-date-mode" id="due-mode-days" value="days" checked>
          Liczba dni od daty wystawienia
        </label>
        <input type="number" id="due-days-input" min="0" placeholder="np. 14">
      </div>

      <div class="form-row">
        <label>
          <input type="radio" name="due-date-mode" id="due-mode-date" value="date">
          Konkretna data
        </label>
        <input type="date" id="due-date-input">
      </div>

      <span class="error-msg" id="err-due-date-modal"></span>

      <div class="form-actions">
        <button type="button" class="btn btn-primary" id="btn-save-due-date">Zapisz</button>
        <button type="button" class="btn btn-secondary" id="btn-cancel-due-date">Anuluj</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
